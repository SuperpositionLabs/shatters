name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgres://shatters:shatters-dev@localhost:5432/shatters_test?sslmode=disable

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
          working-directory: server

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -quiet ./...
        working-directory: server
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: server

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shatters
          POSTGRES_PASSWORD: shatters-dev
          POSTGRES_DB: shatters_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shatters -d shatters_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go test -race
        run: go test -race ./...
        working-directory: server

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build server image
        run: docker build -t shatters-server:ci server
      - name: smoke test the built image
        run: |
          docker network create shatters-ci
          docker run -d --name db --network shatters-ci \
            -e POSTGRES_USER=shatters \
            -e POSTGRES_PASSWORD=shatters-dev \
            -e POSTGRES_DB=shatters \
            --health-cmd "pg_isready -U shatters -d shatters" \
            --health-interval 2s --health-timeout 3s --health-retries 15 \
            postgres:16-alpine
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = healthy ] && break
            sleep 2
          done
          docker run -d --name server --network shatters-ci -p 8080:8080 \
            -e PORT=8080 \
            -e DATABASE_URL='postgres://shatters:shatters-dev@db:5432/shatters?sslmode=disable' \
            shatters-server:ci
          for _ in $(seq 30); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 2
          done
          echo "server never became healthy"
          docker logs server
          exit 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install dependencies
        run: npm ci
      - name: unit tests
        run: npm test
      - name: typecheck
        run: npm run typecheck
      - name: production build
        run: npm run build
