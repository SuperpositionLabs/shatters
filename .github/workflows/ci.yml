name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgres://shatters:shatters-dev@localhost:5432/shatters_test?sslmode=disable

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.1
          working-directory: server

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.21.4
          gosec -quiet ./...
        working-directory: server
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: server

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shatters
          POSTGRES_PASSWORD: shatters-dev
          POSTGRES_DB: shatters_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shatters -d shatters_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go test -race
        run: go test -race ./...
        working-directory: server
