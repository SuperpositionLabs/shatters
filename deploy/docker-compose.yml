# Local development stack: `docker compose up` from this directory.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shatters
      POSTGRES_PASSWORD: shatters-dev
      POSTGRES_DB: shatters
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shatters -d shatters"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      context: ../server
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://shatters:shatters-dev@db:5432/shatters?sslmode=disable
      # Per-IP allowance on the unauthenticated endpoints. Defaults to 60/20
      # when unset; raise it for a busy instance, lower it for a private one.
      RATE_LIMIT_PER_MINUTE: "60"
      RATE_LIMIT_BURST: "20"
      # Browser origins allowed to call from elsewhere. Empty means
      # same-origin only, which is the default deployment. `next dev` runs on
      # 3000, so it is listed here for local development.
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
